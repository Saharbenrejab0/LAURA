document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;max-width:900px\">\n    <span style=\"font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E0B15F\">LAURA · design reference — multi-selection LOA form<\u002Fspan>\n    <h1 style=\"font:600 40px/1.08 'Cormorant Garamond',Georgia,serif;margin:0;letter-spacing:-.01em\">One LOA, many rows<\u002Fh1>\n    <p style=\"font-size:14px;line-height:1.65;color:#CBD3DA;margin:0;text-wrap:pretty\">Three LOA types share one form. What changes is the <strong style=\"font-weight:600;color:#F2F4F6\">axis of repetition<\u002Fstrong>: Frames repeat by brand, Lenses repeat by activity type, everything else is a single row. So the form is built as <em>shared fields on top, repeating rows below<\u002Fem> — and the axis label is the only thing that swaps. Every number below is live: edit a quarter and the totals, the Excel preview, the checklist and the slide count all follow.<\u002Fp>\n  <\u002Fheader>\n\n  <div style=\"display:flex;gap:7px;flex-wrap:wrap;align-items:center\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <span sc-camel-on-click=\"{{ t.on }}\" style=\"font-size:12.5px;font-weight:{{ t.w }};color:{{ t.fg }};background:{{ t.bg }};border:1px solid {{ t.bd }};border-radius:8px;padding:9px 14px;cursor:pointer;user-select:none\">{{ t.label }}<\u002Fspan>\n    <\u002Fsc-for>\n    <span style=\"width:1px;height:20px;background:#242A30;margin:0 5px\"><\u002Fspan>\n    <sc-for list=\"{{ stateToggle }}\" as=\"d\" hint-placeholder-count=\"2\">\n      <span sc-camel-on-click=\"{{ d.on }}\" style=\"font-size:11.5px;font-weight:{{ d.w }};color:{{ d.fg }};background:{{ d.bg }};border:1px solid {{ d.bd }};border-radius:7px;padding:7px 12px;cursor:pointer;user-select:none\">{{ d.label }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;width:1440px;background:#14171A;border:1px solid #242A30;border-radius:14px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.7)\">\n\n    <div style=\"height:54px;background:#101316;border-bottom:1px solid #242A30;display:flex;align-items:center;justify-content:space-between;padding:0 22px\">\n      <div style=\"display:flex;align-items:center;gap:16px;min-width:0\">\n        <span style=\"position:relative;width:26px;height:15px;flex-shrink:0;display:block\">\n          <span style=\"position:absolute;left:0;top:0;width:15px;height:15px;border-radius:99px;border:1.5px solid #F2F4F6\"><\u002Fspan>\n          <span style=\"position:absolute;right:0;top:0;width:15px;height:15px;border-radius:99px;border:1.5px solid #E0B15F\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:13.5px;font-weight:700;letter-spacing:.16em\">LAURA<\u002Fspan>\n        <span style=\"width:1px;height:17px;background:#242A30\"><\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-size:12px;color:#9AA3AD\">LOAs<\u002Fspan>\n          <span style=\"font-size:10px;color:#7C858F\">/<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600\">New LOA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:13px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#7C858F\">{{ autosave }}<\u002Fspan>\n        <span style=\"width:1px;height:17px;background:#242A30\"><\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <span style=\"width:27px;height:27px;border-radius:99px;background:#E0B15F;color:#0B0D0F;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center\">CM<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <span style=\"font-size:11.5px;font-weight:600;line-height:1\">C. Mercier<\u002Fspan>\n            <span style=\"font-size:9px;font-weight:700;letter-spacing:.1em;color:#E0B15F\">LOCAL MARKETER · FRANCE<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isType }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"00 Type selector\" style=\"min-height:812px;display:flex;flex-direction:column;align-items:center;padding:64px 40px 48px;animation:fadeIn .2s ease\">\n        <div style=\"width:1000px;display:flex;flex-direction:column;gap:34px\">\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <span sc-camel-on-click=\"{{ backToLoas }}\" style=\"font-size:12px;color:#9AA3AD;cursor:pointer;align-self:flex-start\">← All LOAs<\u002Fspan>\n            <h2 style=\"font:600 34px/1.15 'Cormorant Garamond',Georgia,serif;margin:0\">What kind of LOA is this?<\u002Fh2>\n            <p style=\"font-size:13.5px;line-height:1.6;color:#A8B1BA;margin:0;max-width:620px;text-wrap:pretty\">This decides how your budget is broken down — and how many rows land in the Excel table on your slide. You can change it later without losing the shared fields.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n\n            <div sc-camel-on-click=\"{{ t1.on }}\" style=\"position:relative;display:flex;flex-direction:column;gap:16px;padding:24px 22px 22px;background:{{ t1.bg }};border:1px solid {{ t1.bd }};border-radius:14px;cursor:pointer;box-shadow:{{ t1.sh }};transition:border-color .16s ease,background .16s ease\">\n              <span style=\"position:absolute;top:18px;right:18px;width:17px;height:17px;border-radius:99px;border:1.5px solid {{ t1.dotBd }};background:{{ t1.dotBg }};display:flex;align-items:center;justify-content:center;font-size:9px;color:#0B0D0F;font-weight:700\">{{ t1.tick }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:4px;width:46px\">\n                <span style=\"height:9px;border-radius:2px;background:{{ t1.ink }}\"><\u002Fspan>\n                <span style=\"height:9px;border-radius:2px;background:{{ t1.faint }}\"><\u002Fspan>\n              <\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <span style=\"font-size:16.5px;font-weight:600;letter-spacing:-.01em\">Standard LOA<\u002Fspan>\n                <span style=\"font-size:12.5px;line-height:1.55;color:#A8B1BA;text-wrap:pretty\">One activity, one brand — the classic LOA.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #242A30;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C858F\">Produces<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#CBD3DA\">1 Excel row · 1 slide<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div sc-camel-on-click=\"{{ t2.on }}\" style=\"position:relative;display:flex;flex-direction:column;gap:16px;padding:24px 22px 22px;background:{{ t2.bg }};border:1px solid {{ t2.bd }};border-radius:14px;cursor:pointer;box-shadow:{{ t2.sh }};transition:border-color .16s ease,background .16s ease\">\n              <span style=\"position:absolute;top:18px;right:18px;width:17px;height:17px;border-radius:99px;border:1.5px solid {{ t2.dotBd }};background:{{ t2.dotBg }};display:flex;align-items:center;justify-content:center;font-size:9px;color:#0B0D0F;font-weight:700\">{{ t2.tick }}<\u002Fspan>\n              <span style=\"display:flex;gap:5px;align-items:flex-start;width:70px\">\n                <span style=\"width:13px;height:31px;border-radius:2px;background:{{ t2.ink }};flex-shrink:0\"><\u002Fspan>\n                <span style=\"flex:1;display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"height:7px;border-radius:2px;background:{{ t2.faint }}\"><\u002Fspan>\n                  <span style=\"height:7px;border-radius:2px;background:{{ t2.faint }}\"><\u002Fspan>\n                  <span style=\"height:7px;border-radius:2px;background:{{ t2.faint }}\"><\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <span style=\"font-size:16.5px;font-weight:600;letter-spacing:-.01em\">Multi-Brand LOA<\u002Fspan>\n                <span style=\"font-size:12.5px;line-height:1.55;color:#A8B1BA;text-wrap:pretty\">One activity type across several brands — each brand gets its own budget row.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #242A30;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C858F\">Typically<\u002Fspan>\n                <span style=\"font-size:11px;color:#CBD3DA\">Frames — “Seasonal Visibility” over Ray-Ban, Oakley, Persol…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div sc-camel-on-click=\"{{ t3.on }}\" style=\"position:relative;display:flex;flex-direction:column;gap:16px;padding:24px 22px 22px;background:{{ t3.bg }};border:1px solid {{ t3.bd }};border-radius:14px;cursor:pointer;box-shadow:{{ t3.sh }};transition:border-color .16s ease,background .16s ease\">\n              <span style=\"position:absolute;top:18px;right:18px;width:17px;height:17px;border-radius:99px;border:1.5px solid {{ t3.dotBd }};background:{{ t3.dotBg }};display:flex;align-items:center;justify-content:center;font-size:9px;color:#0B0D0F;font-weight:700\">{{ t3.tick }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:4px;width:70px\">\n                <span style=\"height:13px;border-radius:2px;background:{{ t3.ink }}\"><\u002Fspan>\n                <span style=\"display:flex;gap:4px\">\n                  <span style=\"flex:1;height:7px;border-radius:2px;background:{{ t3.faint }}\"><\u002Fspan>\n                  <span style=\"flex:1;height:7px;border-radius:2px;background:{{ t3.faint }}\"><\u002Fspan>\n                  <span style=\"flex:1;height:7px;border-radius:2px;background:{{ t3.faint }}\"><\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <span style=\"font-size:16.5px;font-weight:600;letter-spacing:-.01em\">Multi-Activity LOA<\u002Fspan>\n                <span style=\"font-size:12.5px;line-height:1.55;color:#A8B1BA;text-wrap:pretty\">One brand across several activity types — each activity gets its own budget row.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:14px;border-top:1px solid #242A30;display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C858F\">Typically<\u002Fspan>\n                <span style=\"font-size:11px;color:#CBD3DA\">Lenses — “Nikon” over Launch Event, Trade Incentive, Digital…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;background:#1A1F24;border:1px solid #242A30;border-radius:12px;overflow:hidden\">\n            <div sc-camel-on-click=\"{{ toggleNotSure }}\" style=\"display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none\">\n              <span style=\"font-size:12px;color:#E0B15F\">ⓘ<\u002Fspan>\n              <span style=\"font-size:12.5px;font-weight:500;flex:1\">Not sure which to pick?<\u002Fspan>\n              <span style=\"font-size:9px;color:#9AA3AD\">{{ notSureChevron }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ notSureOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 18px 16px 40px;display:flex;flex-direction:column;gap:9px;animation:fadeIn .18s ease\">\n                <span style=\"font-size:12.5px;line-height:1.65;color:#CBD3DA;text-wrap:pretty\">Frames are typically multi-brand — one activity, many brands. Lenses are typically multi-activity — one brand, many activities. If your LOA has just one brand and one activity type, choose Standard.<\u002Fspan>\n                <span style=\"font-size:11.5px;line-height:1.6;color:#9AA3AD;text-wrap:pretty\">Still unsure? Start Standard. If you pick Frames or Lenses as the category, LAURA will offer to switch and keep everything you have already typed.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:6px\">\n            <span style=\"font-size:11.5px;color:#7C858F\">{{ typeHint }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <span style=\"font-size:12.5px;color:#9AA3AD;cursor:pointer\">Cancel<\u002Fspan>\n              <span sc-camel-on-click=\"{{ continueOn }}\" style=\"font-size:13px;font-weight:600;color:{{ ctaFg }};background:{{ ctaBg }};border:1px solid {{ ctaBd }};border-radius:9px;padding:11px 22px;cursor:{{ ctaCursor }};opacity:{{ ctaOp }}\">Continue →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Form\" style=\"display:flex;flex-direction:column;animation:fadeIn .2s ease\">\n\n        <div style=\"display:flex;align-items:center;gap:12px;padding:11px 22px;background:rgba(224,177,95,.08);border-bottom:1px solid #242A30\">\n          <span style=\"font-size:11px;color:#E0B15F\">✦<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openSwitch }}\" style=\"font-size:10px;font-weight:700;letter-spacing:.11em;color:#0B0D0F;background:#E0B15F;border-radius:99px;padding:4px 10px;cursor:pointer;flex-shrink:0\">{{ typeBadge }}<\u002Fspan>\n          <span style=\"font-size:12px;color:#CBD3DA\">{{ bannerText }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ openSwitch }}\" style=\"margin-left:auto;font-size:11.5px;color:#E0B15F;cursor:pointer;flex-shrink:0\">Change type<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:172px 1fr 324px;gap:18px;padding:22px 24px 26px;align-items:start\">\n\n          <nav style=\"display:flex;flex-direction:column;gap:3px;position:sticky;top:0\">\n            <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"6\">\n              <span style=\"display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;background:{{ n.bg }};cursor:pointer;user-select:none\">\n                <span style=\"width:18px;height:18px;border-radius:99px;background:{{ n.numBg }};color:{{ n.numFg }};font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ n.n }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:{{ n.w }};color:{{ n.fg }}\">{{ n.label }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ isMulti }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:3px;margin-top:12px;padding-top:12px;border-top:1px solid #242A30\">\n                <span style=\"font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7C858F;padding:0 9px 5px\">{{ rowNounPlural }}<\u002Fspan>\n                <sc-for list=\"{{ navRows }}\" as=\"nr\" hint-placeholder-count=\"4\">\n                  <span style=\"display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;cursor:pointer;user-select:none\">\n                    <span style=\"width:18px;height:18px;border-radius:99px;background:{{ nr.numBg }};color:{{ nr.numFg }};font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ nr.n }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:{{ nr.fg }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ nr.label }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fnav>\n\n          <div style=\"min-width:0;display:flex;flex-direction:column;gap:14px\">\n\n            <sc-if value=\"{{ isMulti }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:11px;padding:0 2px\">\n                <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7C858F\">{{ sharedLabel }}<\u002Fspan>\n                <span style=\"flex:1;height:1px;background:#242A30\"><\u002Fspan>\n                <span style=\"font-size:10.5px;color:#7C858F\">filled once<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"background:#1A1F25;border:1px solid #242A30;border-radius:12px;padding:17px 18px 18px\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:15px;border-bottom:1px solid #242A30\">\n                  <span style=\"width:19px;height:19px;border-radius:99px;background:#E0B15F;color:#0B0D0F;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ c.n }}<\u002Fspan>\n                  <span style=\"font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A8B1BA\">{{ c.title }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:10.5px;color:#7C858F\">{{ c.note }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n                  <sc-for list=\"{{ c.fields }}\" as=\"f\" hint Portugal', 'Luxottica Portugal Comercio de Optica SA', '0019', 'EUR'],\n  ['North', 'United Kingdom', 'Luxottica North Europe Limited', '0018', 'GBP'],\n  ['North', 'Netherlands', 'Luxottica Nederland BV', '0025', 'EUR'],\n  ['North', 'Belgium', 'Luxottica Belgium NV', '0022', 'EUR'],\n  ['North', 'Finland', 'OY Luxottica Finlandia AB', '0026', 'EUR'],\n  ['North', 'Sweden', 'Luxottica Nordic AB', '0031', 'SEK'],\n  ['North', 'Norway', 'Luxottica Norge A.S.', '0066', 'NOK'],\n  ['East', 'Greece', 'Luxottica Hellas AE', '0021', 'EUR'],\n  ['East', 'Poland', 'Luxottica Poland Sp zoo', '0037', 'PLN'],\n  ['East', 'Hungary', 'Luxottica Central Europe KFT', '00193', 'HUF'],\n  ['East', 'Croatia', 'LUXOTTICA SOUTH EASTERN EUROPE LTD', '0C68', 'EUR'],\n  ['East', 'Czech Rep. & Slovakia', 'Luxottica Central Europe KFT', '00193', 'EUR'],\n  ['East', 'Russia', 'Luxottica RUS LLC', '0164', 'RUB'],\n  ['META Excl Turkey', 'South Africa', 'Luxottica Southern Africa (PTY) LTD', '0039', 'ZAR'],\n  ['META Excl Turkey', 'Israel', 'Luxottica Optics (Israele)', '0041', 'ILS'],\n  ['META Excl Turkey', 'UAE', 'Luxottica Middle East FZE', '0070', 'AED'],\n  ['Turkey', 'Turkey', 'Luxottica Turchia', '0043', 'TRY'],\n];\n\nconst BRANDS = [\n  ['HB', ['Ray-Ban', 'Oakley', 'Persol', 'Vogue', 'Oliver Peoples', 'Costa', 'Native', 'Others (HB)']],\n  ['LB', ['Versace', 'Prada', 'Dolce & Gabbana', 'Emporio Armani', 'Giorgio Armani', 'Polo Ralph Lauren', 'Burberry', 'Tiffany', 'Miu Miu', 'Prada Linea Rossa', 'Chanel', 'Michael Kors', 'Coach', 'Jimmy Choo', 'Swarovski', 'Ferrari', 'Starck', 'Others (LB)']],\n  ['Essilor', ['Varilux', 'Crizal', 'Transitions', 'Stellest', 'Eyezen', 'Multibrand', 'Nikon', 'Kodak', 'Xperio']],\n];\n\nconst ACTIVITIES = ['Permanent Visibility', 'Seasonal Visibility', 'Trade Incentive', 'PR & Communication', 'Medical Affairs', 'Digital & CRM', 'Consumer Activation', 'Launch Event', 'Travel Award', 'Communication Assets', 'Digital Consumer Journey', 'Training & Education', 'Store Concept', 'Other'];\nconst CATEGORIES = ['CORE (Lenses)', 'FRAMES', 'ALL WEARABLES', 'SUN', 'Other'];\n\nconst C = {\n  tile: '#1A1F25', card: '#1A1F24', sunken: '#0E1114', bd: '#242A30', bdS: '#2A3138',\n  t1: '#F2F4F6', t2: '#CBD3DA', t3: '#A8B1BA', t4: '#9AA3AD', t5: '#7C858F',\n  gold: '#E0B15F', goldBg: 'rgba(224,177,95,.10)', goldBd: 'rgba(224,177,95,.30)',\n  bad: '#E88A80', badBg: 'rgba(232,138,128,.12)', badBd: 'rgba(232,138,128,.35)',\n  ok: '#6FD39B', okBg: '#12291E', okBd: '#255440',\n};\n\nclass Component extends DCLogic {\n  state = {\n    screen: null, loaType: 'mbrand', notSure: false, blank: false,\n    cluster: 'France', country: 'France', entity: 'Luxottica France SAS', currency: 'EUR',\n    activity: 'Seasonal Visibility', category: 'FRAMES', brand: 'Nikon',\n    openDd: 'country', suggest: 'mbrand', dialog: null, preview: true,\n    drills: { mb2: true }, showErr: null,\n    rows: {\n      mbrand: [\n        { id: 'mb1', name: 'HB - Ray-Ban', customer: 'Selected clients — key accounts', vendor: 'Lumia Retail Services', doors: 420, q: [38, 26, 14, 10], drill: 'Window kits 24K€ · in-store builds 41K€ · staff training 13K€ · digital support 10K€' },\n        { id: 'mb2', name: 'HB - Oakley', customer: 'Sport & performance network', vendor: 'Lumia Retail Services', doors: 180, q: [16, 12, 9, 5], drill: 'Perf. corners 22K€ · athlete assets 12K€ · sampling 8K€' },\n        { id: 'mb3', name: 'HB - Persol', customer: 'Premium independents', vendor: 'Atelier Vitrine SAS', doors: 95, q: [9, 7, 4, 2], drill: '' },\n        { id: 'mb4', name: 'LB - Versace', customer: 'Fashion doors — Paris & Riviera', vendor: 'Atelier Vitrine SAS', doors: 60, q: [6, 5, 3, 2], drill: '' },\n      ],\n      mact: [\n        { id: 'ma1', name: 'Launch Event', customer: '2nd Network + white space', detail: 'National launch event at the Optika trade fair, Prague — 240 ECPs hosted', vendor: 'Prague Events Group', doors: 140, q: [90, 0, 0, 0], drill: 'Venue 34K€ · staging 28K€ · hospitality 18K€ · travel 10K€' },\n        { id: 'ma2', name: 'Trade Incentive', customer: '2nd Network + white space', detail: 'Sell-out incentive on Nikon progressive range, tiered by volume', vendor: 'Nikon Partners CZ', doors: 320, q: [0, 35, 0, 0], drill: '' },\n        { id: 'ma3', name: 'Digital Consumer Journey', customer: 'Consumer — CZ & SK', detail: 'Always-on search + social driving store locator traffic', vendor: 'Havas CZ', doors: 0, q: [0, 0, 65, 10], drill: '' },\n      ],\n    },\n  };\n\n  // ── helpers ──────────────────────────────────────────────────────────\n  axis() { return this.state.loaType === 'mact' ? 'mact' : 'mbrand'; }\n  isMB() { return this.state.loaType === 'mbrand'; }\n  liveRows() { return this.state.rows[this.axis()]; }\n  rowTotal(r) { return r.q.reduce((a, b) => a + (Number(b) || 0), 0); }\n  k(n) { return n ? '€' + n.toLocaleString('en-US').replace(/,/g, ' ') + 'k' : '—'; }\n  eur(n) { return '€' + (n * 1000).toLocaleString('en-US').replace(/,/g, ' '); }\n  perSlide() { return Math.max(2, Math.min(10, this.props.rowsPerSlide ?? 6)); }\n  blankRow(i) {\n    const id = this.axis() + '_new' + Date.now() + i;\n    return { id, name: '', customer: '', detail: '', vendor: '', doors: 0, q: [0, 0, 0, 0], drill: '' };\n  }\n  setRows(fn) {\n    const ax = this.axis();\n    this.setState(s => ({ rows: { ...s.rows, [ax]: fn(s.rows[ax]) } }));\n  }\n  errOn() { return this.state.showErr ?? this.props.showValidation ?? false; }\n\n  // ── field builder ────────────────────────────────────────────────────\n  f(label, val, o) {\n    o = o || {};\n    const blank = this.state.blank && !o.keep;\n    const v = blank ? '' : val;\n    const missing = o.req && !v;\n    const err = missing && this.errOn();\n    return {\n      label, star: o.req ? '*' : '', span: o.span || 1,\n      val: v || o.ph || '', valFg: v ? (o.calc ? C.gold : C.t1) : C.t5,\n      family: o.mono ? \"'JetBrains Mono',monospace\" : 'inherit',\n      bg: o.calc ? C.goldBg : C.sunken, bd: err ? C.badBd : (o.calc ? C.goldBd : C.bdS),\n      h: o.ta ? '68px' : '35px', pad: o.ta ? '9px 11px' : '8px 11px',\n      cursor: o.dd ? 'pointer' : 'text', suffix: o.suffix || (o.dd ? '▾' : ''),\n      note: err ? 'Required' : (o.note || ''), noteFg: err ? C.bad : C.t5,\n      on: o.dd ? () => this.setState(s => ({ openDd: s.openDd === o.dd ? null : o.dd })) : () => {},\n      ddOpen: o.dd && this.state.openDd === o.dd, ddSearch: o.search || 'Search…',\n      ddOptions: o.dd ? o.options || [] : [],\n    };\n  }\n  opt(label, sub, on, sel) {\n    return { label, sub: sub || '', on, bg: sel ? '#1B2228' : 'transparent', fg: sel ? C.gold : C.t2, w: sel ? 600 : 400, pad: '8px 11px', cursor: 'pointer', size: '12px', ls: 'normal', tt: 'none' };\n  }\n\n  countryOpts() {\n    return REF.filter(r => r[0] === this.state.cluster).map(r =>\n      this.opt(r[1], r[3], () => this.setState({ country: r[1], entity: r[2], currency: r[4], openDd: null }), r[1] === this.state.country));\n  }\n  clusterOpts() {\n    const names = [...new Set(REF.map(r => r[0]))];\n    return names.map(n => {\n      const cs = REF.filter(r => r[0] === n);\n      return this.opt(n, cs.length + ' countries', () => {\n        const first = cs[0];\n        this.setState({ cluster: n, country: first[1], entity: first[2], currency: first[4], openDd: null });\n      }, n === this.state.cluster);\n    });\n  }\n  entityOpts() {\n    return REF.filter(r => r[1] === this.state.country).map(r =>\n      this.opt(r[2], r[3] + ' · ' + r[4], () => this.setState({ entity: r[2], currency: r[4], openDd: null }), r[2] === this.state.entity));\n  }\n  brandOpts(onPick) {\n    const out = [];\n    BRANDS.forEach(([grp, list]) => {\n      out.push({ label: grp === 'HB' ? 'House brands' : grp === 'LB' ? 'Licensed brands' : 'Essilor lenses', sub: '', on: () => {}, bg: '#14171A', fg: C.t5, w: 700, pad: '7px 11px', cursor: 'default', size: '9.5px', ls: '.12em', tt: 'uppercase' });\n      list.forEach(b => {\n        const full = grp === 'Essilor' ? b : grp + ' - ' + b;\n        out.push(this.opt(full, '', () => onPick(full), false));\n      });\n    });\n    return out;\n  }\n  activityOpts(onPick) { return ACTIVITIES.map(a => this.opt(a, '', () => onPick(a), false)); }\n\n  // ── cards ────────────────────────────────────────────────────────────\n  cards() {\n    const s = this.state, mb = this.isMB(), multi = s.loaType !== 'standard';\n    const loc = {\n      n: 1, title: 'Location', note: 'from imported reference data', fields: [\n        this.f('Cluster', s.cluster, { req: true, dd: 'cluster', options: this.clusterOpts(), keep: true }),\n        this.f('Country', s.country, { req: true, dd: 'country', options: this.countryOpts(), note: 'Filters from cluster', keep: true }),\n        this.f('Legal Entity', s.entity, { span: 2, dd: 'entity', options: this.entityOpts(), note: 'Auto-filled from country', keep: true }),\n      ],\n    };\n    const cls = {\n      n: 2, title: 'Classification', note: multi ? (mb ? 'the shared axis' : 'activity type varies per row') : '', fields: [],\n    };\n    if (!multi || mb) cls.fields.push(this.f('Activity Type', s.activity, { req: true, dd: 'activity', options: this.activityOpts(a => this.setState({ activity: a, openDd: null })) }));\n    cls.fields.push(this.f('Channel of Trade', 'All COT', { req: true, dd: 'cot', options: ['All COT', 'Optical chains', 'Independents', 'Sunglass specialists', 'E-tail'].map(o => this.opt(o, '', () => this.setState({ openDd: null }), o === 'All COT')) }));\n    cls.fields.push(this.f('CAPEX / OPEX', 'OpEx', { req: true, dd: 'capex', options: ['OpEx', 'CapEx'].map(o => this.opt(o, '', () => this.setState({ openDd: null }), o === 'OpEx')) }));\n    cls.fields.push(this.f('ADV / Selling / Others', 'ADV', { req: true, dd: 'adv', options: ['ADV', 'Selling', 'Others (non ADV)'].map(o => this.opt(o, '', () => this.setState({ openDd: null }), o === 'ADV')) }));\n\n    const prod = { n: 3, title: multi ? (mb ? 'Product — category' : 'Product — the shared brand') : 'Product', note: '', fields: [] };\n    prod.fields.push(this.f('Category', s.category, { req: true, span: multi ? 2 : 1, dd: 'category', options: CATEGORIES.map(c => this.opt(c, '', () => this.setState({ category: c, openDd: null, suggest: c === 'FRAMES' ? 'mbrand' : c === 'CORE (Lenses)' ? 'mact' : null }), c === s.category)), note: multi ? (mb ? 'Locked by Multi-Brand — Frames' : 'Locked by Multi-Activity — Lenses') : '', keep: true }));\n    if (!multi || !mb) prod.fields.push(this.f('Brand', mb ? '' : s.brand, { req: true, span: multi ? 2 : 1, dd: 'brand', options: this.brandOpts(b => this.setState({ brand: b, openDd: null })), search: 'Search 35 brands…', keep: !multi ? false : true }));\n\n    const inv = {\n      n: 4, title: 'Investment', note: '', fields: [\n        this.f('Customer', 'Selected clients — key accounts', { span: 2 }),\n        this.f('Vendor', 'Lumia Retail Services', { req: true, span: 2 }),\n        this.f('Currency', s.currency, { mono: true, note: 'From legal entity', keep: true }),\n        this.f('# Customers', '18', { mono: true }),\n        this.f('# Doors', '420', { mono: true }),\n        this.f('Avg Inv / Door', '€ 209', { mono: true, calc: true, note: 'Auto-calculated · locked', keep: true }),\n      ],\n    };\n    const bud = {\n      n: 5, title: 'Budget', note: 'in K€', fields: [\n        this.f('Q1 2026', '38', { mono: true, suffix: 'k' }),\n        this.f('Q2 2026', '26', { mono: true, suffix: 'k' }),\n        this.f('Q3 2026', '14', { mono: true, suffix: 'k' }),\n        this.f('Q4 2026', '10', { mono: true, suffix: 'k' }),\n        this.f('Q4 2025 (prior year)', '', { mono: true, suffix: 'k', ph: 'optional', span: 2 }),\n        this.f('FY 2026 total', '€ 88 000', { mono: true, calc: true, span: 2, note: 'Auto-calculated · locked', keep: true }),\n      ],\n    };\n    const dates = {\n      n: multi ? 4 : 6, title: 'Dates', note: multi ? 'shared by every row' : '', fields: [\n        this.f('Start date', '01 Feb 2026', { req: true, mono: true }),\n        this.f('End date', '30 Jun 2026', { req: true, mono: true }),\n        this.f('Timing', 'H1 2026 (Q1–Q2)', { span: 2, note: 'Inferred from the quarters you fill', keep: true }),\n      ],\n    };\n    const desc = {\n      n: multi ? 5 : 7, title: 'Description', note: multi ? 'describes the campaign, not the rows' : '', fields: [\n        this.f('Description — the WHY', mb ? 'Defend share of shelf in the French premium channel through a coordinated seasonal push across the house portfolio.' : 'Establish Nikon as the reference progressive brand in CZ & SK by recruiting the independent network ahead of the 2026 season.', { req: true, span: 4, ta: true }),\n        this.f('Detail / Tools — the HOW', mb ? 'Window kits · in-store builds · ECP staff training · always-on digital support' : 'Launch event · tiered sell-out incentive · always-on digital journey · shared communication assets', { req: true, span: 4, ta: true }),\n        this.f('KPI', mb ? '+12% sell-out uplift · 755 doors activated' : 'Topline +1M€ · 460 doors recruited', { req: true, span: 2 }),\n        this.f('Cost drill-down', multi ? 'Per row — see the drill-down on each row below' : 'Space rental 87K€ · booth 98K€ · catering 15K€', { req: true, span: 2, keep: multi }),\n      ],\n    };\n    const req = {\n      n: multi ? 6 : 8, title: 'Requestor', note: '', fields: [\n        this.f('Requestor email', 'claire.mercier@essilorluxottica.com', { req: true, span: 2, keep: true }),\n        this.f('Finance validator email', 'simona.smacchia@ae.luxottica.com', { span: 2, keep: true }),\n      ],\n    };\n    if (!multi) return [loc, cls, prod, inv, bud, dates, desc, req];\n    return [loc, cls, prod, dates, desc, req];\n  }\n\n  // ── rows ─────────────────────────────────────────────────────────────\n  rowsView() {\n    const mb = this.isMB(), list = this.liveRows(), err = this.errOn();\n    return list.map((r, i) => {\n      const total = this.rowTotal(r);\n      const missing = [];\n      if (!r.name) missing.push(mb ? 'brand' : 'activity type');\n      if (!r.vendor) missing.push('vendor');\n      let e = '';\n      if (err && missing.length) e = (mb ? 'Brand ' : 'Row ') + (i + 1) + ' is missing its ' + missing.join(' and ') + '.';\n      else if (err && total === 0) e = (mb ? 'Brand ' : 'Row ') + (i + 1) + ' has no budget allocated.';\n\n      const pick = v => this.setRows(rs => rs.map((x, j) => j === i ? { ...x, name: v } : x));\n      const fields = mb ? [\n        this.f('Brand', r.name, { req: true, span: 2, dd: 'row' + r.id, options: this.brandOpts(v => { pick(v); this.setState({ openDd: null }); }), search: 'Search 35 brands…', keep: true, ph: 'Pick a brand' }),\n        this.f('Customer', r.customer, { span: 2, keep: true, ph: 'Who is covered' }),\n        this.f('Vendor', r.vendor, { req: true, span: 2, keep: true, ph: 'Supplier' }),\n        this.f('# Doors', r.doors || '', { mono: true, keep: true, ph: '0' }),\n        this.f('Avg / Door', r.doors ? '€ ' + Math.round(total * 1000 / r.doors) : '—', { mono: true, calc: true, keep: true }),\n      ] : [\n        this.f('Activity Type', r.name, { req: true, span: 2, dd: 'row' + r.id, options: this.activityOpts(v => { pick(v); this.setState({ openDd: null }); }), keep: true, ph: 'Pick an activity type' }),\n        this.f('Customer', r.customer, { span: 2, keep: true, ph: 'Who is covered' }),\n        this.f('Vendor', r.vendor, { req: true, span: 2, keep: true, ph: 'Supplier' }),\n        this.f('# Doors', r.doors || '', { mono: true, span: 2, keep: true, ph: '0' }),\n        this.f('Detail — specific to this activity', r.detail, { span: 8, keep: true, ph: 'What exactly happens for this activity type' }),\n      ];\n\n      return {\n        num: i + 1, name: r.name || (mb ? 'brand ' + (i + 1) : 'row ' + (i + 1)),\n        bd: e ? C.badBd : C.bd,\n        badgeBg: r.name ? C.gold : '#2A3138', badgeFg: r.name ? '#0B0D0F' : C.t4,\n        fields,\n        qs: ['Q1 2026', 'Q2 2026', 'Q3 2026', 'Q4 2026'].map((label, qi) => ({\n          label, v: r.q[qi],\n          bd: err && total === 0 ? C.badBd : C.bdS,\n          on: ev => {\n            const val = ev.target.value === '' ? 0 : Number(ev.target.value);\n            this.setRows(rs => rs.map((x, j) => j === i ? { ...x, q: x.q.map((qq, k) => k === qi ? val : qq) } : x));\n          },\n        })),\n        total: total ? this.eur(total) : '€0',\n        drillOpen: !!this.state.drills[r.id], drillChevron: this.state.drills[r.id] ? '▾' : '▸',\n        drill: r.drill || 'Break the row budget down here — this text lands in the Cost drill-down block on the slide.',\n        drillFg: r.drill ? C.t2 : C.t5,\n        drillOn: () => this.setState(st => ({ drills: { ...st.drills, [r.id]: !st.drills[r.id] } })),\n        remove: () => {\n          if (list.length <= 2) { this.setState({ dialog: 'min' }); return; }\n          if (r.name || total) { this.setState({ dialog: 'rm:' + i }); return; }\n          this.setRows(rs => rs.filter((_, j) => j !== i));\n        },\n        up: () => i > 0 && this.setRows(rs => { const a = rs.slice(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; return a; }),\n        down: () => i < list.length - 1 && this.setRows(rs => { const a = rs.slice(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; return a; }),\n        upFg: i > 0 ? C.t4 : '#2A3138', downFg: i < list.length - 1 ? C.t4 : '#2A3138',\n        err: e,\n      };\n    });\n  }\n\n  // ── slides ───────────────────────────────────────────────────────────\n  slideCols() {\n    const mb = this.isMB();\n    return [\n      { label: 'Country', f: 1.1 }, { label: 'Plan', f: .9 }, { label: 'Customer', f: 1.7 },\n      { label: mb ? 'Brand' : 'Activity', f: 1.5 }, { label: mb ? 'Detail' : 'Brand', f: 1.7 },\n      { label: '#Doors', f: .8 }, { label: 'Q1', f: .7 }, { label: 'Q2', f: .7 }, { label: 'Q3', f: .7 }, { label: 'Q4', f: .7 }, { label: 'Total', f: 1 },\n    ];
