# ─────────────────────────────────────────────────────────────────────────
# 5. ADVERSARIAL — Traps, typos, ambiguous phrasing
# ─────────────────────────────────────────────────────────────────────────

- id: adv_001
  category: adversarial
  question: "What is the LOA balance for John?"
  tool: deep_search
  expected_answer_avoids: ["Leave of Absence", "employee leave", "vacation"]
  notes: "TRAP: 'LOA balance for John' sounds like HR Leave of Absence. Laura must recognize LOA as Letter of Authorization and answer accordingly (or clarify)."

- id: adv_002
  category: adversarial
  question: "raybann events itali"
  tool: deep_search
  expected_filters:
    brand: "Ray-Ban"
    country: "Italy"
    activity_type: "Events"
  expected_answer_mentions: ["Ray-Ban", "Italy"]
  expected_answer_avoids: ["Leave of Absence"]
  notes: "TYPO: Should still extract Ray-Ban, Italy, Events despite typos"

- id: adv_003
  category: adversarial
  question: "compare oakley vs raybon in dach"
  tool: deep_search
  expected_answer_mentions: ["Oakley", "Ray-Ban"]
  expected_answer_avoids: ["Leave of Absence"]
  notes: "TYPO: 'raybon' should be understood as Ray-Ban"

- id: adv_004
  category: adversarial
  question: "show me the stuff"
  tool: deep_search
  expected_answer_avoids: ["Leave of Absence"]
  notes: "AMBIGUOUS: Vague question. Laura should either ask for clarification or return sensible default results."

- id: adv_005
  category: adversarial
  question: "How much did we spend on employee leaves last year?"
  tool: stats
  expected_answer_avoids: ["employee leave", "vacation", "sick leave"]
  notes: "TRAP: User is testing if Laura confuses LOA with Leave of Absence. Should either clarify or answer only about LOA marketing budgets."

- id: adv_006
  category: adversarial
  question: "What did LOA 999999999 cost?"
  tool: deep_search
  expected_answer_avoids: ["Leave of Absence"]
  notes: "EDGE: Non-existent LOA number. Laura should say 'no LOA found' or similar, not invent."

- id: adv_007
  category: adversarial
  question: "give me all data"
  tool: stats
  expected_answer_avoids: ["Leave of Absence"]
  notes: "AMBIGUOUS: Should not dump the whole DB. Should ask for clarification or give a summary."

- id: adv_008
  category: adversarial
  question: "Ray-Ban Ray-Ban Ray-Ban budget"
  tool: deep_search
  expected_filters:
    brand: "Ray-Ban"
  expected_answer_mentions: ["Ray-Ban", "EUR"]
  expected_answer_avoids: ["Leave of Absence"]
  notes: "REPETITION: Redundant terms should not confuse the filter extractor."

- id: adv_009
  category: adversarial
  question: "budget budget budget"
  tool: stats
  expected_answer_avoids: ["Leave of Absence"]
  notes: "GARBAGE: No real question. Should ask what specifically."

- id: adv_010
  category: adversarial
  question: "Compare LOA approval times to industry standard sick leave duration"
  tool: deep_search
  expected_answer_avoids: ["sick leave", "employee leave", "vacation"]
  notes: "TRAP: Explicitly mentions 'sick leave' to try to trigger Leave of Absence context. Laura must stay focused on marketing LOAs."
