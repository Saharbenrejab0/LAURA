# ═════════════════════════════════════════════════════════════════════════
# LAURA RAG Evals — 50 questions across 5 categories
# ═════════════════════════════════════════════════════════════════════════
#
# Each eval has:
#   id                       Unique identifier
#   category                 structured | semantic | hybrid | memory | adversarial
#   question                 The user-facing question
#   tool                     Expected engine: deep_search | stats | summarize
#   expected_filters         (Optional) Filters the extractor should produce
#   expected_sources_where   (Optional) At least one source must match these fields
#   expected_answer_mentions (Optional) Answer should mention these keywords
#   expected_answer_avoids   (Optional) Answer should NOT mention these words
#   history                  (Optional) Previous conversation for memory tests
#   notes                    (Optional) Human notes on what this tests
#
# Scoring: each eval is scored on 4 criteria, weighted:
#   filter_accuracy    (30%)  — filters extracted match expected
#   source_relevance   (30%)  — retrieved sources match expected
#   answer_quality     (30%)  — answer mentions/avoids keywords correctly
#   no_hallucination   (10%)  — no "Leave of Absence", no invented data

# ─────────────────────────────────────────────────────────────────────────
